<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modem 管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📱 Modem 管理</h1>
            <select id="portSelect" onchange="app.loadPortRelatedInfo()">
                <option value="">-- 选择串口 --</option>
            </select>
            <button id="refreshBtn" onclick="app.refreshPorts()">刷新</button>
            <div class="token-bar" title="与服务端 API_TOKEN 一致；保存在浏览器 localStorage">
                <label for="apiToken">API Token</label>
                <input type="password" id="apiToken" placeholder="鉴权令牌" autocomplete="off" />
                <button type="button" id="saveTokenBtn">保存</button>
            </div>
        </header>

        <main>
            <!-- Modem 信息 -->
            <section class="card">
                <div class="card-header">
                    <h2>Modem 信息</h2>
                    <div class="card-actions">
                        <button onclick="app.getModemInfo()">获取信息</button>
                        <button onclick="app.getSignalStrength()">信号强度</button>
                    </div>
                </div>
                <div id="modemInfo">
                    <div class="info-item">
                        <span class="info-label">串口:</span><span class="info-value">{info.port}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">制造商:</span><span class="info-value">{info.manufacturer}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">型号:</span><span class="info-value">{info.model}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">IMEI:</span><span class="info-value">{info.imei}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">手机号:</span><span class="info-value">{info.phoneNumber}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">运营商:</span><span class="info-value">{info.operator}</span>
                    </div>
                </div>
                <div id="signalInfo">
                    <div class="info-item">
                        <span class="info-label">信号强度 (RSSI):</span><span class="info-value">{signal.rssi}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">信号质量:</span><span class="info-value">{signal.quality}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">dBm:</span><span class="info-value">{signal.dbm}</span>
                    </div>
                </div>
            </section>

            <!-- 接收短信 -->
            <section class="card">
                <div class="card-header">
                    <h2>接收短信</h2>
                    <div class="card-actions">
                        <button onclick="app.listSMS()">刷新短信</button>
                    </div>
                </div>
                <div id="smsList" class="sms-list">
                    <div class="sms-item">
                        <div class="sms-header">
                            <span class="sms-number">📱 {sms.number}</span>
                            <span class="sms-time">🕐 {sms.time}</span>
                            <button class="delete-btn" onclick="app.deleteSMS({sms.index})">删除</button>
                        </div>
                        <div class="sms-message">{sms.message}</div>
                    </div>
                </div>
            </section>

            <!-- 发送短信 -->
            <section class="card">
                <div class="card-header">
                    <h2>发送短信</h2>
                    <div class="card-actions">
                        <button onclick="app.sendSMS()">发送短信</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>收件人号码:</label>
                    <input type="text" id="smsNumber" placeholder="+86XXXXXXXXXXX" />
                </div>
                <div class="form-group">
                    <label>短信内容:</label>
                    <textarea id="smsMessage" rows="4" placeholder="输入短信内容... "></textarea>
                </div>
            </section>

            <!-- AT 命令 -->
            <section class="card">
                <div class="card-header">
                    <h2>AT 命令终端</h2>
                    <div class="card-actions">
                        <button onclick="app.sendATCommand()">发送指令</button>
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" id="atCommand" placeholder="输入 AT 命令 (例如:  AT+CGMI)" />
                </div>
                <div class="terminal" id="terminal"></div>
            </section>

            <!-- 实时日志 -->
            <section class="card">
                <div class="card-header">
                    <h2>实时日志</h2>
                    <div class="card-actions">
                        <button onclick="app.clearLog()">清空日志</button>
                    </div>
                </div>
                <div class="log" id="log"></div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
